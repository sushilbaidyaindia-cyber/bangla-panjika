name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If a file named project.zip was uploaded, unpack it into the repo (then delete the zip).
      # This is how the whole project, or later only the changed files, get in without uploading folder by folder.
      - name: Unpack project.zip
        run: |
          if [ -f project.zip ]; then
            unzip -q -o project.zip
            rm project.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project.zip" || true
            git push || true
          fi

      # The history data (births, deaths, events, special days) is fetched from Wikipedia once and then kept in the repo.
      # To fetch it again, delete app/src/main/assets/history.json from the repo and run the build.
      - name: Fetch history data (only when the file is not in the repo yet)
        if: hashFiles('app/src/main/assets/history.json') == ''
        continue-on-error: true
        run: python3 scripts/fetch_history.py app/src/main/assets/history.json

      - name: Keep the history data in the repo
        continue-on-error: true
        run: |
          if [ -f app/src/main/assets/history.json ] && [ -n "$(git status --porcelain app/src/main/assets/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/history.json
            git commit -m "Add history data" || true
            git push || true
          fi
          ls -la app/src/main/assets 2>/dev/null || echo "no assets folder (history data missing)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Panjika-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as the "latest" release (fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk Bangla-Panjika.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Bangla-Panjika.apk \
            --title "Bangla Panjika - latest build" \
            --notes "Built automatically from the latest upload" \
            --target "$(git rev-parse HEAD)"
