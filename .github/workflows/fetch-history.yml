name: Fetch history data

# Fetches births / deaths / events / special days from Wikipedia and keeps them in the repo (history.json),
# then starts a normal build so the app gets them. Runs by itself when this file is uploaded, or by hand
# (Actions > Fetch history data > Run workflow). Never blocks the APK build.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-history.yml'

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch history data
        continue-on-error: true
        run: python3 -u scripts/fetch_history.py app/src/main/assets/history.json 2>&1 | tee scripts/history-fetch.log

      - name: Save data and log in the repo, then start a build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f scripts/history-fetch.log ] && git add scripts/history-fetch.log
          [ -f app/src/main/assets/history.json ] && git add app/src/main/assets/history.json
          git commit -m "History data and fetch log" || true
          git pull --rebase -q || true
          git push || true
          if [ -f app/src/main/assets/history.json ]; then gh workflow run build.yml || true; fi
