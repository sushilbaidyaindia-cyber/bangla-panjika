plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sushilbaidyaindia.banglapanjika'
    compileSdk 34

    defaultConfig {
        applicationId "com.sushilbaidyaindia.banglapanjika"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    // fixed signing key (stored as text in debug-keystore.txt) so every GitHub build is signed the same
    // and a new APK installs over the old one.
    def ksFile = new File(buildDir, 'fixed-debug.keystore')
    if (!ksFile.exists()) {
        ksFile.parentFile.mkdirs()
        ksFile.bytes = file('debug-keystore.txt').text.replaceAll('\\s', '').decodeBase64()
    }
    signingConfigs {
        debug {
            storeFile ksFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
